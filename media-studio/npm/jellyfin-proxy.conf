# Paste this into NPM → Proxy Host → Advanced tab for media.yourstudio.com

# Security headers
add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options "nosniff";
add_header X-XSS-Protection "1; mode=block";
add_header Referrer-Policy "strict-origin-when-cross-origin";
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss:;";

# Rate limiting on auth endpoint
limit_req_zone $binary_remote_addr zone=jellyfin_auth:10m rate=10r/m;
location /Users/authenticatebyname {
    limit_req zone=jellyfin_auth burst=5 nodelay;
    proxy_pass http://jellyfin:8096;
}

# Large video streaming settings
client_max_body_size 0;
proxy_read_timeout 600s;
proxy_send_timeout 600s;
proxy_buffering off;
proxy_request_buffering off;
